name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out released commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Install Mise tools
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: jdx/mise-action@v4

      - name: Verify released commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: mise run check

      - name: Build release archives
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          mkdir -p dist

          for target in \
            darwin/amd64 \
            darwin/arm64 \
            linux/amd64 \
            linux/arm64
          do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            archive="mesij_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
            staging="$(mktemp -d)"

            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              mise exec -- go build -trimpath -o "$staging/mesij" ./cmd/mesij

            tar -C "$staging" -czf "dist/$archive" mesij
            rm -rf "$staging"
          done

          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      - name: Upload release archives
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" dist/*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY"
